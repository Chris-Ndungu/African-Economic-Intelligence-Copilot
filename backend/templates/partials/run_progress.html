<section id="results" class="run-progress" data-run-id="{{ investigation_id }}" aria-label="Investigation progress"
         data-cancelled-text="Cancelled. The investigation was stopped and saved as failed."
         data-lost-text="The connection was lost. The investigation may still finish: its saved outcome will appear in the history."
         hx-ext="sse" sse-connect="/partials/investigations/{{ investigation_id }}/progress" sse-close="close">
  <h2>Running the investigation</h2>
  <ol id="run-steps" class="steps" aria-live="polite" sse-swap="step" hx-swap="beforeend"></ol>
  <span class="run-ping" sse-swap="ping" hidden></span>
  <div id="run-outcome" sse-swap="outcome" aria-live="polite"></div>
  <p class="run-controls"><button class="button secondary" type="button" data-cancel-run>Cancel</button></p>
</section>
