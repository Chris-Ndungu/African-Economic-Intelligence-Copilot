<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ request.app.state.settings.app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/{{ htmx_file }}" defer></script>
  <script src="/static/{{ sse_file }}" defer></script>
  <script src="/static/{{ plotly_file }}" defer></script>
  <script src="/static/charts.js" defer></script>
  <script src="/static/table-sort.js" defer></script>
  <script src="/static/local-time.js" defer></script>
  <script src="/static/history.js" defer></script>
  <script src="/static/run.js" defer></script>
  <script src="/static/export.js" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  {% set meta = page_meta(request) %}
  <div class="mode-banner mode-{{ meta.data_mode }}" role="status" data-mode="{{ meta.data_mode }}">{{ banner_text(meta) }}</div>
  <header class="site-header">
    <h1>{{ request.app.state.settings.app_name }}</h1>
    <a class="button" href="/">New investigation</a>
  </header>
  <div class="layout">
    {% block content %}{% endblock %}
  </div>
  <script type="application/json" id="error-messages">{{ error_messages|tojson }}</script>
</body>
</html>
