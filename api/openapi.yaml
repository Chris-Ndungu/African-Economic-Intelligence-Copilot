openapi: 3.1.0
info:
  title: African Economic Intelligence Copilot API
  version: 0.1.0
  summary: Contract between the investigation workspace and the FastAPI backend.
  description: |
    The OpenAPI contract for the investigation workspace. It changes before
    the API behavior does (see `_docs/api.md`).

    Conventions used by every operation:

    - Every response that returns data includes `data_mode`, `demo` (bundled
      sample snapshot) or `live` (curated BigQuery data).
    - A missing value is `null`, never `0`. Fields that can be missing say so.
    - Every 4xx and 5xx response uses the shared `Error` schema. `503` means
      Gemini, the data service or the database is unavailable, and the
      `service` field names which one.

    The data-related schemas (countries, indicators, coverage, units and
    result fields) are based on `_docs/plan.md`. They will be revised through
    this contract once `_docs/data-contract.md` documents the curated models.
    Example values are illustrative, not real statistics.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8000
    description: Local development server
security: []
tags:
  - name: health
    description: Liveness of the API process.
  - name: reference
    description: Countries, indicators and data coverage available for investigation.
  - name: investigations
    description: Run, save, list, update and export investigations.

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness check
      description: >-
        Reports that the API process is up. It does not touch Postgres,
        Gemini or BigQuery and returns no data, so it has no `data_mode`.
      responses:
        "200":
          description: The API process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              examples:
                ok:
                  summary: Healthy
                  value:
                    status: ok

  /api/meta:
    get:
      tags: [health]
      operationId: getMeta
      summary: Data mode and Gemini configuration
      description: >-
        Reports which data the app is serving, so a client can label it:
        `demo` (the bundled sample snapshot, with its `snapshot_date`), `live`,
        or `unknown` when the mode cannot be determined, for example because
        the snapshot date cannot be read. It never reports `live` by assumption.
        It also says whether Gemini is configured. It does not call Gemini,
        Postgres or BigQuery.
      responses:
        "200":
          description: The data mode, the demo snapshot date and whether Gemini is configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
              examples:
                demo:
                  summary: Demo mode
                  value:
                    data_mode: demo
                    snapshot_date: "2026-11-11"
                    gemini_configured: true

  /api/countries:
    get:
      tags: [reference]
      operationId: listCountries
      summary: List countries
      description: Lists the countries present in the active data source.
      responses:
        "200":
          description: The countries available for investigation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountryList"
              examples:
                demo:
                  summary: Countries in demo mode
                  value:
                    data_mode: demo
                    countries:
                      - code: KEN
                        name: Kenya
                        region: Eastern Africa
                      - code: NGA
                        name: Nigeria
                        region: Western Africa
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/indicators:
    get:
      tags: [reference]
      operationId: listIndicators
      summary: List indicators
      description: Lists the indicators present in the active data source, with their units and frequency.
      responses:
        "200":
          description: The indicators available for investigation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndicatorList"
              examples:
                demo:
                  summary: Indicators in demo mode
                  value:
                    data_mode: demo
                    indicators:
                      - code: PCPIPCH
                        name: IMF DataMapper
                        category: inflation
                        unit: "%"
                        frequency: annual
                        description: Annual percentage change in the consumer price index.
                        source:
                          id: fact_macroeconomic_indicators
                          name: IMF DataMapper
                          provider: IMF
                          url: null
                          last_updated: "2026-06-30"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/coverage:
    get:
      tags: [reference]
      operationId: getCoverage
      summary: Get data coverage
      description: >-
        Returns, for each country and indicator pair, the periods covered and
        how many observations are missing. Without filters it returns every
        pair in the active data source.
      parameters:
        - name: country
          in: query
          description: ISO 3166-1 alpha-3 country codes to filter by. Repeat the parameter for several.
          required: false
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/CountryCode"
        - name: indicator
          in: query
          description: Indicator codes to filter by. Repeat the parameter for several.
          required: false
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/IndicatorCode"
      responses:
        "200":
          description: Coverage for the requested countries and indicators.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Coverage"
              examples:
                kenyaInflation:
                  summary: Coverage of Kenya inflation
                  value:
                    data_mode: demo
                    entries:
                      - country_code: KEN
                        indicator_code: PCPIPCH
                        frequency: annual
                        first_period: "2000"
                        last_period: "2023"
                        observation_count: 23
                        missing_count: 1
                        last_updated: "2026-06-30"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/investigations/run:
    post:
      tags: [investigations]
      operationId: runInvestigation
      summary: Run an investigation and save it
      description: >-
        Runs a whole investigation inside the request and returns the saved
        investigation: Gemini calls the approved analysis tools, interprets
        the computed results, every number in the interpretation is checked
        against the tool results, and the investigation is saved. Send a
        `question`, a `selection` or both; with both, the selection limits
        what the tools may query. A selection alone runs the question
        "Describe the trend in <indicator> for <countries> from <start> to
        <end>". The run is saved as `failed`, never as a success, when
        Gemini, the data service or the time limit fails it; the response
        is then `503` naming the service, `422` when the step limit was
        reached, or `500`. An unsupported question is saved as `succeeded`
        with `interpretation.unsupported_reason` set and no findings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestigationRunRequest"
            examples:
              question:
                summary: A question with a selection
                value:
                  question: Why did inflation in Kenya rise in 2022?
                  selection:
                    countries: [KEN]
                    indicator: PCPIPCH
                    start: "2015"
                    end: "2023"
      responses:
        "200":
          description: The saved investigation, with status `succeeded`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investigation"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/investigations/runs:
    post:
      tags: [investigations]
      operationId: createInvestigationRun
      summary: Create an investigation run to stream
      description: >-
        Saves an investigation as `pending` without running it. Open
        `GET /api/investigations/{investigation_id}/events` to run it and
        receive its progress. The body and its `422` rules are the same as
        `runInvestigation`. The question is sent in this body, never in a
        URL, so it stays out of access logs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestigationRunRequest"
      responses:
        "202":
          description: The investigation was created as `pending`; it has not started.
          headers:
            Location:
              description: The URL of the event stream that runs the investigation.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestigationRunAccepted"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/investigations/{investigation_id}/events:
    parameters:
      - $ref: "#/components/parameters/InvestigationId"
    get:
      tags: [investigations]
      operationId: streamInvestigationEvents
      summary: Run a pending investigation and stream its progress
      description: >-
        A server-sent event stream, readable with `EventSource`. Opening it
        for a `pending` investigation claims and runs it inside this
        response; each step is sent as it happens. Every event has an
        increasing `id`, an `event:` name and a JSON `data:` payload whose
        schema is named after the event (`started` uses
        `StartedEvent`, and so on). The first event is `started` and the
        last is exactly one `saved` or `failed`; the stream then closes.
        For an investigation that already finished, only its final `saved`
        or `failed` event is sent. For one that another connection is
        running, a single `in_progress` event is sent. A `: ping` comment
        is sent at least every 15 seconds while a step runs. Closing the
        connection cancels the run, which is saved as `failed` with code
        `client_disconnected`.
      responses:
        "200":
          description: >-
            The event stream. Event names: `started`, `fetching_data`,
            `analysis_started`, `analysis_finished`, `interpreting`,
            `validating`, `saved`, `failed` and `in_progress`.
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                id: 1
                event: started
                data: {"investigation_id": "7f9c2b1e-4d3a-4c5b-9e8f-1a2b3c4d5e6f"}

                id: 2
                event: fetching_data
                data: {"tool": "analyze_trend"}

        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/investigations:
    get:
      tags: [investigations]
      operationId: listInvestigations
      summary: List saved investigations
      description: >-
        Lists saved investigations, newest (most recently created) first. Pagination is
        cursor-based: pass `next_cursor` from one page as `cursor` to get the
        next. `next_cursor` is `null` on the last page.
      parameters:
        - name: limit
          in: query
          description: Page size. Defaults to 20; the maximum is 100.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: Opaque cursor from a previous page's `next_cursor`. Omit it for the first page.
          required: false
          schema:
            type: string
      responses:
        "200":
          description: One page of saved investigations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestigationList"
              examples:
                firstPage:
                  summary: First page with more to follow
                  value:
                    data_mode: demo
                    items:
                      - id: 7f9c2b1e-4d3a-4c5b-9e8f-1a2b3c4d5e6f
                        title: Kenya inflation 2022
                        status: succeeded
                        data_mode: demo
                        investigation_type: anomaly
                        countries: [KEN, NGA]
                        indicators: [PCPIPCH]
                        created_at: "2026-11-07T10:15:00Z"
                        updated_at: "2026-11-07T10:20:00Z"
                    limit: 20
                    next_cursor: eyJ1cGRhdGVkX2F0IjoiMjAyNi0xMS0wN1QxMDoyMDowMFoifQ
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags: [investigations]
      operationId: saveInvestigation
      summary: Save an investigation
      description: Saves an investigation request and its result to the investigation history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestigationCreate"
      responses:
        "201":
          description: The saved investigation.
          headers:
            Location:
              description: URL of the saved investigation.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investigation"
              examples:
                saved:
                  $ref: "#/components/examples/InvestigationExample"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/investigations/{investigation_id}:
    parameters:
      - $ref: "#/components/parameters/InvestigationId"
    get:
      tags: [investigations]
      operationId: getInvestigation
      summary: Fetch a saved investigation
      description: Returns a saved investigation with its request and result.
      responses:
        "200":
          description: The saved investigation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investigation"
              examples:
                saved:
                  $ref: "#/components/examples/InvestigationExample"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      tags: [investigations]
      operationId: updateInvestigation
      summary: Update a saved investigation
      description: >-
        Updates the fields given, for example a new title, or a new request
        and result when the analyst continues the investigation. Fields left
        out keep their values.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestigationUpdate"
            examples:
              rename:
                summary: Rename an investigation
                value:
                  title: Kenya and Nigeria inflation, 2018-2023
      responses:
        "200":
          description: The updated investigation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investigation"
              examples:
                updated:
                  $ref: "#/components/examples/InvestigationExample"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/investigations/{investigation_id}/report:
    parameters:
      - $ref: "#/components/parameters/InvestigationId"
    get:
      tags: [investigations]
      operationId: exportInvestigationPdf
      summary: Export an investigation as PDF
      description: >-
        Renders a PDF report from the stored investigation result: findings,
        charts, methodology, sources, caveats and the generation time. It
        does not ask Gemini for a new answer. The report is labelled with its
        data mode, which is also returned in the `X-Data-Mode` header.
      responses:
        "200":
          description: The PDF report.
          headers:
            X-Data-Mode:
              description: The data mode of the investigation in the report.
              schema:
                $ref: "#/components/schemas/DataMode"
            Content-Disposition:
              description: Suggested file name, for example `attachment; filename="investigation-7f9c2b1e.pdf"`.
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                contentMediaType: application/pdf
              examples:
                report:
                  summary: A PDF file (binary, truncated)
                  value: "%PDF-1.7 ..."
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  parameters:
    InvestigationId:
      name: investigation_id
      in: path
      required: true
      description: Identifier of a saved investigation.
      schema:
        type: string
        format: uuid

  responses:
    ValidationError:
      description: The request is invalid, for example an unknown country code or a period whose start is after its end.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            validation:
              summary: Invalid request
              value:
                code: validation_error
                message: The request is invalid.
                service: null
                details:
                  - field: countries.0
                    message: Unknown country code "XXX".
    NotFound:
      description: No saved investigation has this identifier.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            notFound:
              summary: Unknown investigation
              value:
                code: not_found
                message: Investigation 7f9c2b1e-4d3a-4c5b-9e8f-1a2b3c4d5e6f was not found.
                service: null
                details: []
    InternalError:
      description: An unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            internal:
              summary: Unexpected error
              value:
                code: internal_error
                message: An unexpected error occurred.
                service: null
                details: []
    ServiceUnavailable:
      description: >-
        A service the operation depends on is unavailable: Gemini, the data
        service (DuckDB or BigQuery) or the investigation database. `service`
        names which one.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            gemini:
              summary: Gemini unavailable
              value:
                code: service_unavailable
                message: Gemini is unavailable, so the results could not be interpreted.
                service: gemini
                details: []
            dataService:
              summary: Data service unavailable
              value:
                code: service_unavailable
                message: The data service is unavailable.
                service: data_service
                details: []

  examples:
    InvestigationResultExample:
      summary: Anomaly investigation of Kenya inflation (illustrative values)
      value:
        data_mode: demo
        request:
          question: Why did inflation in Kenya rise in 2022?
          investigation_type: anomaly
          countries: [KEN, NGA]
          indicators: [PCPIPCH]
          period:
            start: "2018"
            end: "2023"
          parameters:
            baseline_periods: 4
            anomaly_method: z_score
            anomaly_threshold: 2
        findings:
          - id: finding-1
            kind: anomaly
            metric: PCPIPCH
            statement: Kenya's 2022 inflation of 7.7% is 3.98 standard deviations above its 2018-2021 mean of 5.35%.
            value: 7.7
            unit: "%"
            period:
              start: "2022"
              end: "2022"
              frequency: annual
            geography:
              country_code: KEN
              country_name: Kenya
            method:
              name: z_score
              description: Distance from the baseline mean in baseline standard deviations.
              parameters:
                baseline_periods: 4
                threshold: 2
            source:
              id: fact_macroeconomic_indicators
              name: IMF DataMapper
              provider: IMF
              url: null
              last_updated: "2026-06-30"
            caveats:
              - The 2023 value is missing, so the baseline cannot show whether the rise persisted.
            result_ids: [anomaly-1, baseline-1]
        series:
          - id: series-1
            metric: PCPIPCH
            unit: "%"
            period:
              start: "2018"
              end: "2023"
              frequency: annual
            geography:
              country_code: KEN
              country_name: Kenya
            method:
              name: observed
              description: Values as published, without transformation.
              parameters: {}
            source:
              id: fact_macroeconomic_indicators
              name: IMF DataMapper
              provider: IMF
              url: null
              last_updated: "2026-06-30"
            caveats:
              - 2023 is missing in the source.
            points:
              - period: "2018"
                value: 4.7
              - period: "2019"
                value: 5.2
              - period: "2020"
                value: 5.4
              - period: "2021"
                value: 6.1
              - period: "2022"
                value: 7.7
              - period: "2023"
                value: null
        comparisons:
          - id: comparison-1
            metric: PCPIPCH
            method:
              name: compare_shared_periods
              description: Values aligned on the periods every country shares, ranked by the value at the latest shared period, highest first.
              parameters: {}
            shared_periods: ["2018", "2019", "2020", "2021", "2022"]
            ranking_period: "2022"
            caveats: []
            entries:
              - value: 18.8
                unit: "%"
                period:
                  start: "2018"
                  end: "2022"
                  frequency: annual
                geography:
                  country_code: NGA
                  country_name: Nigeria
                method:
                  name: compare_shared_periods
                  description: Values aligned on the periods every country shares, ranked by the value at the latest shared period, highest first.
                  parameters: {}
                source:
                  id: fact_macroeconomic_indicators
                  name: IMF DataMapper
                  provider: IMF DataMapper
                  url: null
                  last_updated: "2026-10-29"
                caveats: []
                rank: 1
                status: ranked
                first_period: "2018"
                last_period: "2022"
                observation_count: 5
                shared_count: 5
                excluded_periods: []
                mean: 14.6
                median: 13.2
                minimum: 11.4
                maximum: 18.8
                standard_deviation: 2.9
              - value: 7.7
                unit: "%"
                period:
                  start: "2018"
                  end: "2022"
                  frequency: annual
                geography:
                  country_code: KEN
                  country_name: Kenya
                method:
                  name: compare_shared_periods
                  description: Values aligned on the periods every country shares, ranked by the value at the latest shared period, highest first.
                  parameters: {}
                source:
                  id: fact_macroeconomic_indicators
                  name: IMF DataMapper
                  provider: IMF DataMapper
                  url: null
                  last_updated: "2026-10-29"
                caveats: []
                rank: 2
                status: ranked
                first_period: "2018"
                last_period: "2022"
                observation_count: 5
                shared_count: 5
                excluded_periods: []
                mean: 5.82
                median: 5.4
                minimum: 4.7
                maximum: 7.7
                standard_deviation: 1.15
        baselines:
          - id: baseline-1
            metric: PCPIPCH
            value: 7.7
            unit: "%"
            period:
              start: "2022"
              end: "2022"
              frequency: annual
            geography:
              country_code: KEN
              country_name: Kenya
            method:
              name: historical_baseline
              description: Compares the target value with the trailing window before it. Percentile rank is the percent of window values less than or equal to the target.
              parameters:
                window: 4
            source:
              id: fact_macroeconomic_indicators
              name: IMF DataMapper
              provider: IMF DataMapper
              url: null
              last_updated: "2026-10-29"
            caveats: []
            baseline_value: 5.35
            baseline_period:
              start: "2018"
              end: "2021"
              frequency: annual
            difference: 2.35
            percent_difference: 43.93
            median: 5.3
            standard_deviation: 0.59
            z_score: 3.98
            percentile_rank: 100
            window_count: 4
            missing_count: 0
        anomalies:
          - id: anomaly-1
            metric: PCPIPCH
            unit: "%"
            period:
              start: "2018"
              end: "2022"
              frequency: annual
            geography:
              country_code: KEN
              country_name: Kenya
            method:
              name: rolling_zscore
              description: Each value is compared with the trailing window before it.
              parameters:
                window: 4
                threshold: 3.0
            source:
              id: fact_macroeconomic_indicators
              name: IMF DataMapper
              provider: IMF DataMapper
              url: null
              last_updated: "2026-10-29"
            caveats: []
            scored_count: 1
            flagged_count: 1
            points:
              - value: 7.7
                unit: "%"
                period:
                  start: "2022"
                  end: "2022"
                  frequency: annual
                geography:
                  country_code: KEN
                  country_name: Kenya
                method:
                  name: rolling_zscore
                  description: Each value is compared with the trailing window before it.
                  parameters:
                    window: 4
                    threshold: 3.0
                source:
                  id: fact_macroeconomic_indicators
                  name: IMF DataMapper
                  provider: IMF DataMapper
                  url: null
                  last_updated: "2026-10-29"
                caveats: []
                status: flagged
                reason: null
                is_anomaly: true
                score: 3.98
                threshold: 3.0
                expected_value: 5.35
                direction: up
                window:
                  start: "2018"
                  end: "2021"
                  frequency: annual
                baseline_mean: 5.35
                baseline_standard_deviation: 0.59
                q1: null
                q3: null
                iqr: null
        interpretation:
