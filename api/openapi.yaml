  schemas:
    Health:
      type: object
      description: Liveness status, as returned by `GET /health`.
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Meta:
      type: object
      description: What the app is serving, as returned by `GET /api/meta`.
      required: [data_mode, snapshot_date, gemini_configured]
      properties:
        data_mode:
          type: string
          enum: [demo, live, unknown]
          description: >-
            `demo` is the bundled sample snapshot, `live` is curated BigQuery
            data, `unknown` means the mode could not be determined. A client
            must label `unknown` as unknown, never as live.
        snapshot_date:
          type: [string, "null"]
          format: date
          description: The date of the demo snapshot, or `null` when not in demo mode or unreadable.
        gemini_configured:
          type: boolean
          description: Whether a Gemini API key is set, so runs can start.

    DataMode:
      type: string
      enum: [demo, live]
      description: >-
        Where the data came from. `demo` is the bundled sample snapshot and
        must be labelled as sample data; `live` is curated BigQuery data for
        authorized users.

    Error:
      type: object
      description: The shared error body for every 4xx and 5xx response.
      required: [code, message, service, details]
      properties:
        code:
          type: string
          description: Machine-readable error code.
          enum: [validation_error, not_found, step_limit_reached, service_unavailable, internal_error]
        message:
          type: string
          description: Human-readable explanation of the error.
        service:
          type: [string, "null"]
          description: >-
            The service that failed, or `null` when the error is not caused by
            an unavailable service. Set on every `503` except a run over its
            time limit, which no single service caused.
          enum: [gemini, data_service, database, null]
        details:
          type: array
          description: Per-field problems for `validation_error`; empty otherwise.
          items:
            $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: Dotted path of the invalid field, for example `countries.0` or `period.start`.
        message:
          type: string

    CountryCode:
      type: string
      description: ISO 3166-1 alpha-3 country code.
      pattern: "^[A-Z]{3}$"
      examples: [KEN]
    IndicatorCode:
      type: string
      description: >-
        Source code of an indicator, as returned by `listIndicators`, for
        example `PCPIPCH` (IMF) or `SL.UEM.TOTL.ZS` (World Bank).
      pattern: "^[A-Za-z0-9_.]+$"
      examples: [PCPIPCH, SL.UEM.TOTL.ZS]
    Frequency:
      type: string
      enum: [annual, quarterly, monthly, daily]
    PeriodLabel:
      type: string
      description: >-
        A period: `YYYY` for annual, `YYYY-Qn` for quarterly, `YYYY-MM` for
        monthly or `YYYY-MM-DD` for daily data. A daily label must be a real
        calendar date.
      pattern: "^[0-9]{4}(-Q[1-4]|-(0[1-9]|1[0-2])(-(0[1-9]|[12][0-9]|3[01]))?)?$"
      examples: ["2022", "2022-Q1", "2022-01", "2022-01-31"]

    Country:
      type: object
      required: [code, name, region]
      properties:
        code:
          $ref: "#/components/schemas/CountryCode"
        name:
          type: string
        region:
          type: [string, "null"]
          description: African sub-region, or `null` when the source does not record one.
    CountryList:
      type: object
      required: [data_mode, countries]
      properties:
        data_mode:
          $ref: "#/components/schemas/DataMode"
        countries:
          type: array
          items:
            $ref: "#/components/schemas/Country"

    Indicator:
      type: object
      required: [code, name, category, unit, frequency, description, source]
      properties:
        code:
          $ref: "#/components/schemas/IndicatorCode"
        name:
          type: string
        category:
          type: string
          description: The theme of the indicator in `dim_indicator`, in lower case.
          enum: [gdp, inflation, trade, debt, fiscal, labour, demographics, investment, savings, financial, digital]
        unit:
          type: string
          description: Unit of the values, for example `percent`, `USD millions` or `local currency per USD`.
        frequency:
          $ref: "#/components/schemas/Frequency"
        description:
          type: [string, "null"]
          description: Definition of the indicator, or `null` when the source gives none.
        source:
          $ref: "#/components/schemas/Source"
    IndicatorList:
      type: object
      required: [data_mode, indicators]
      properties:
        data_mode:
          $ref: "#/components/schemas/DataMode"
        indicators:
          type: array
          items:
            $ref: "#/components/schemas/Indicator"

    CoverageEntry:
      type: object
      description: Coverage of one indicator for one country.
      required:
        - country_code
        - indicator_code
        - frequency
        - first_period
        - last_period
        - observation_count
        - missing_count
        - last_updated
      properties:
        country_code:
          $ref: "#/components/schemas/CountryCode"
        indicator_code:
          $ref: "#/components/schemas/IndicatorCode"
        frequency:
          $ref: "#/components/schemas/Frequency"
        first_period:
          description: First period with a value, or `null` when there are no observations.
          oneOf:
            - $ref: "#/components/schemas/PeriodLabel"
            - type: "null"
        last_period:
          description: Last period with a value, or `null` when there are no observations.
          oneOf:
            - $ref: "#/components/schemas/PeriodLabel"
            - type: "null"
        observation_count:
          type: integer
          minimum: 0
          description: Number of periods with a value.
        missing_count:
          type: integer
          minimum: 0
          description: Number of periods between `first_period` and `last_period` with no value. Missing values are not counted as zero.
        last_updated:
          type: [string, "null"]
          format: date
          description: When the source last updated this series, or `null` if unknown.
    Coverage:
      type: object
      required: [data_mode, entries]
      properties:
        data_mode:
          $ref: "#/components/schemas/DataMode"
        entries:
          type: array
          items:
            $ref: "#/components/schemas/CoverageEntry"

    Period:
      type: object
      description: >-
        The period a result covers, from `start` to `end` inclusive. `start`
        must not be after `end`, and both labels must use the format of
        `frequency`.
      required: [start, end, frequency]
      properties:
        start:
          $ref: "#/components/schemas/PeriodLabel"
        end:
          $ref: "#/components/schemas/PeriodLabel"
        frequency:
          $ref: "#/components/schemas/Frequency"
    PeriodRange:
      type: object
      description: A requested period, from `start` to `end` inclusive. `start` must not be after `end`.
      required: [start, end]
      properties:
        start:
          $ref: "#/components/schemas/PeriodLabel"
        end:
          $ref: "#/components/schemas/PeriodLabel"
    Geography:
      type: object
      required: [country_code, country_name]
      properties:
        country_code:
          $ref: "#/components/schemas/CountryCode"
        country_name:
          type: string
          minLength: 1
    Method:
      type: object
      description: The calculation that produced a result and the parameters it used.
      required: [name, description, parameters]
      properties:
        name:
          type: string
          minLength: 1
          description: Identifier of the method, for example `z_score` or `historical_mean`.
        description:
          type: string
          minLength: 1
        parameters:
          type: object
          description: >-
            Parameter names and the values used. A value is a string, a
            number, a boolean or a list of these, so it always serializes to
            JSON.
          additionalProperties:
            $ref: "#/components/schemas/MethodParameterValue"
    MethodParameterValue:
      oneOf:
        - $ref: "#/components/schemas/MethodParameterScalar"
        - type: array
          items:
            $ref: "#/components/schemas/MethodParameterScalar"
    MethodParameterScalar:
      type: [string, number, boolean]
    Source:
      type: object
      description: Lineage of the data behind a result.
      required: [id, name, provider, url, last_updated]
      properties:
        id:
          type: string
          minLength: 1
          description: Identifier of the curated dataset or model.
        name:
          type: string
          minLength: 1
        provider:
          type: [string, "null"]
          description: Original publisher, for example `IMF`, or `null` if unknown.
        url:
          type: [string, "null"]
          format: uri
          description: Link to the original source, or `null` if there is none.
        last_updated:
          type: [string, "null"]
          format: date
          description: When the source last updated the data, or `null` if unknown.
    Caveats:
      type: array
      description: Data-quality caveats and limits on interpretation. Empty when there are none.
      items:
        type: string
        minLength: 1

    NumericResult:
      type: object
      description: >-
        A computed number with everything needed to cite it. `value` is
        `null` when the value is missing; a missing value is never `0`, and
        `caveats` must then say why it is missing. Numbers are finite: NaN
        and infinity are not valid values.
      required: [value, unit, period, geography, method, source, caveats]
      properties:
        value:
          type: [number, "null"]
          description: The computed value, or `null` when it is missing. A missing value is never `0`.
        unit:
          type: string
          minLength: 1
        period:
          $ref: "#/components/schemas/Period"
        geography:
          $ref: "#/components/schemas/Geography"
        method:
          $ref: "#/components/schemas/Method"
        source:
          $ref: "#/components/schemas/Source"
        caveats:
          $ref: "#/components/schemas/Caveats"

    Finding:
      description: >-
        A statement of fact computed in Python, with the number it rests on.
        Gemini's interpretation cites findings by `id`. `value` is `null` when
        the finding is about missing data; a missing value is never `0`.
      allOf:
        - $ref: "#/components/schemas/NumericResult"
        - type: object
          required: [id, kind, metric, statement, result_ids]
          properties:
            id:
              type: string
            kind:
              type: string
              enum: [trend, comparison, baseline, anomaly, data_gap]
            metric:
              $ref: "#/components/schemas/IndicatorCode"
            statement:
              type: string
              description: The finding in one sentence, generated from the computed values.
            result_ids:
              type: array
              description: Identifiers of the series, comparison, baseline or anomaly results that support the finding.
              items:
                type: string

    SeriesPoint:
      type: object
      required: [period, value]
      properties:
        period:
          $ref: "#/components/schemas/PeriodLabel"
        value:
          type: [number, "null"]
          description: The value for the period, or `null` when it is missing. A missing value is never `0`.
    Series:
      type: object
      description: >-
        A time series of one indicator for one country. The values are in
        `points`; each point's `value` is `null` when missing, never `0`,
        and `caveats` must then say why. Each point's period lies within
        `period` and uses the format of its `frequency`.
      required: [id, metric, unit, period, geography, method, source, caveats, points]
      properties:
        id:
          type: string
        metric:
          $ref: "#/components/schemas/IndicatorCode"
        unit:
          type: string
          minLength: 1
        period:
          $ref: "#/components/schemas/Period"
        geography:
          $ref: "#/components/schemas/Geography"
        method:
          $ref: "#/components/schemas/Method"
        source:
          $ref: "#/components/schemas/Source"
        caveats:
          $ref: "#/components/schemas/Caveats"
        points:
          type: array
          items:
            $ref: "#/components/schemas/SeriesPoint"

    Count:
      type: integer
      minimum: 0
    NullablePeriodLabel:
      oneOf:
        - $ref: "#/components/schemas/PeriodLabel"
        - type: "null"
    ComparisonEntry:
      description: >-
        One country's value in a comparison. `value` is the value at the
        comparison's `ranking_period`, `null` when missing, never `0`; `rank`
        is then `null` too. The statistics cover the shared periods; a
        country with no value in them has `status` `no_data` and no rank.
      allOf:
        - $ref: "#/components/schemas/NumericResult"
        - type: object
          required:
            - rank
            - status
            - first_period
            - last_period
            - observation_count
            - shared_count
            - excluded_periods
            - mean
            - median
            - minimum
            - maximum
            - standard_deviation
          properties:
            rank:
              type: [integer, "null"]
              minimum: 1
              description: Position by value, 1 being the highest, or `null` when the value is missing. A rank is a position, not a judgement.
            status:
              type: string
              enum: [ranked, unranked, no_data]
              description: "`unranked` when the country has shared data but no value at the ranking period."
            first_period:
              $ref: "#/components/schemas/NullablePeriodLabel"
            last_period:
              $ref: "#/components/schemas/NullablePeriodLabel"
            observation_count:
              $ref: "#/components/schemas/Count"
            shared_count:
              $ref: "#/components/schemas/Count"
            excluded_periods:
              type: array
              description: Periods with a value that were left out because not every country has them.
              items:
                $ref: "#/components/schemas/PeriodLabel"
            mean:
              type: [number, "null"]
            median:
              type: [number, "null"]
            minimum:
              type: [number, "null"]
            maximum:
              type: [number, "null"]
            standard_deviation:
              type: [number, "null"]
    ComparisonResult:
      type: object
      description: >-
        The same indicator compared across countries over the periods they
        all share. Each entry is a full numeric result with its own value,
        unit, period, geography, method, source and caveats.
      required: [id, metric, method, shared_periods, ranking_period, caveats, entries]
      properties:
        id:
          type: string
        metric:
          $ref: "#/components/schemas/IndicatorCode"
        method:
          $ref: "#/components/schemas/Method"
        shared_periods:
          type: array
          items:
            $ref: "#/components/schemas/PeriodLabel"
        ranking_period:
          $ref: "#/components/schemas/NullablePeriodLabel"
        caveats:
          $ref: "#/components/schemas/Caveats"
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ComparisonEntry"

    BaselineResult:
      description: >-
        A value compared with its own history. `value` is the observed value
        for `period`; `baseline_value` is the mean of the window in
        `baseline_period`, which never includes `period`. Any number that
        cannot be computed is `null`, never `0`.
      allOf:
        - $ref: "#/components/schemas/NumericResult"
        - type: object
          required:
            - id
            - metric
            - baseline_value
            - baseline_period
            - difference
            - percent_difference
            - median
            - standard_deviation
            - z_score
            - percentile_rank
            - window_count
            - missing_count
          properties:
            id:
              type: string
            metric:
              $ref: "#/components/schemas/IndicatorCode"
            baseline_value:
              type: [number, "null"]
              description: The mean over `baseline_period`, or `null` when it cannot be computed.
            baseline_period:
              $ref: "#/components/schemas/Period"
            difference:
              type: [number, "null"]
              description: "`value` minus `baseline_value`, in `unit`, or `null` when either is missing."
            percent_difference:
              type: [number, "null"]
              description: The difference as a percentage of `baseline_value`, or `null` when it cannot be computed.
            median:
              type: [number, "null"]
            standard_deviation:
              type: [number, "null"]
            z_score:
              type: [number, "null"]
            percentile_rank:
              type: [number, "null"]
              description: Percent of window values less than or equal to `value`.
            window_count:
              $ref: "#/components/schemas/Count"
            missing_count:
              $ref: "#/components/schemas/Count"

    AnomalyPoint:
      description: >-
        The anomaly test on one value. `status` is `not_scored` when the test
        could not run, and `reason` says why. The window is trailing: a value
        is judged only against earlier values.
      allOf:
        - $ref: "#/components/schemas/NumericResult"
        - type: object
          required:
            - status
            - reason
            - is_anomaly
            - score
            - threshold
            - expected_value
            - direction
            - window
            - baseline_mean
            - baseline_standard_deviation
            - q1
            - q3
            - iqr
          properties:
            status:
              type: string
              enum: [flagged, normal, not_scored]
            reason:
              type: [string, "null"]
              description: Why the point was not scored, or `null`.
            is_anomaly:
              type: [boolean, "null"]
              description: Whether the value was flagged, or `null` when it was not scored.
            score:
              type: [number, "null"]
              description: The z-score, or the distance beyond the nearest IQR fence, or `null` when not scored.
            threshold:
              type: number
              description: The z-score threshold or the IQR multiplier.
            expected_value:
              type: [number, "null"]
              description: The window mean (z-score) or median (IQR), or `null` when not computed.
            direction:
              type: [string, "null"]
              enum: [up, down, null]
              description: Whether a flagged value is above (`up`) or below (`down`) its baseline; `null` otherwise.
            window:
              description: The trailing window, or `null` when there is none.
              oneOf:
                - $ref: "#/components/schemas/Period"
                - type: "null"
            baseline_mean:
              type: [number, "null"]
            baseline_standard_deviation:
              type: [number, "null"]
            q1:
              type: [number, "null"]
            q3:
              type: [number, "null"]
            iqr:
              type: [number, "null"]
    AnomalyResult:
      type: object
      description: >-
        An anomaly test over every value of one series. `scored_count` tells
        "no anomalies" (scored, none flagged) apart from "could not check"
        (nothing scored).
      required: [id, metric, unit, period, geography, method, source, caveats, scored_count, flagged_count, points]
      properties:
        id:
          type: string
        metric:
          $ref: "#/components/schemas/IndicatorCode"
        unit:
          type: string
          minLength: 1
        period:
          $ref: "#/components/schemas/Period"
        geography:
          $ref: "#/components/schemas/Geography"
        method:
          $ref: "#/components/schemas/Method"
        source:
          $ref: "#/components/schemas/Source"
        caveats:
          $ref: "#/components/schemas/Caveats"
        scored_count:
          $ref: "#/components/schemas/Count"
        flagged_count:
          $ref: "#/components/schemas/Count"
        points:
          type: array
          items:
            $ref: "#/components/schemas/AnomalyPoint"

    CitedNumber:
      type: object
      description: A number a finding uses, with the tool result field it comes from.
      required: [value, unit, result_id, field]
      properties:
        value:
          type: number
        unit:
          type: string
        result_id:
          type: string
          description: The tool result the number comes from, for example `r1`.
        field:
          type: string
          description: >-
            Dotted path to the number in that result's `data`, with list
            positions as numbers, for example `slope.value` or
            `entries.0.value`.
    NumberCheck:
      type: object
      description: >-
        How one number was checked against the tool results. `text` is the
        number as written, or the cited value for a cited number.
      required: [text, value, result_id, field, verified, reason]
      properties:
        text:
          type: string
        value:
          type: number
        result_id:
          type: [string, "null"]
        field:
          type: [string, "null"]
        verified:
          type: boolean
        reason:
          type: [string, "null"]
          description: Why the number could not be traced, or `null` when it was verified.
    InterpretationFinding:
      type: object
      description: One claim of the interpretation and the tool results it rests on.
      required: [statement, label, result_ids, numbers, verification, checks, reasons]
      properties:
        statement:
          type: string
        label:
          type: string
          description: >-
            `fact` restates computed results; `hypothesis` is a possible
            explanation the evidence supports but does not prove.
          enum: [fact, hypothesis]
        result_ids:
          type: array
          minItems: 1
          items:
            type: string
        numbers:
          type: array
          items:
            $ref: "#/components/schemas/CitedNumber"
        verification:
          type: string
          description: >-
            `verified` when every number traces to a tool result and every
            cited result exists. Unverified findings are kept and flagged.
          enum: [verified, unverified]
        checks:
          type: array
          items:
            $ref: "#/components/schemas/NumberCheck"
        reasons:
          type: array
          description: >-
            Why the finding is unverified, for example `unknown result r9`
            or `2.5 (not in any tool result)`; empty when it is verified.
          items:
            type: string
    Interpretation:
      type: object
      description: >-
        Gemini's structured reading of the tool results, after every number
        in it was checked against them.
      required:
        - summary
        - findings
        - caveats
        - data_gaps
        - unsupported_reason
        - summary_checks
        - verified_count
        - unverified_count
        - model
        - prompt_version
      properties:
        summary:
          type: string
        findings:
          type: array
          description: Empty when the question is unsupported.
          items:
            $ref: "#/components/schemas/InterpretationFinding"
        caveats:
          type: array
          items:
            type: string
        data_gaps:
          type: array
          description: Missing data and stale series that limit the interpretation.
          items:
            type: string
        unsupported_reason:
          type: [string, "null"]
          description: Why the question cannot be answered from the data, or `null`.
        summary_checks:
          type: array
          description: The checks of the numbers in `summary`.
          items:
            $ref: "#/components/schemas/NumberCheck"
        verified_count:
          type: integer
          minimum: 0
        unverified_count:
          type: integer
          minimum: 0
        model:
          type: string
          description: The model that wrote the interpretation.
        prompt_version:
          type: string
          description: The version of the interpretation prompt, for example `interpret_v1`.
    ToolResult:
      type: object
      description: One successful tool call's result, which findings cite by `result_id`.
      required: [result_id, tool, arguments, data]
      properties:
        result_id:
          type: string
        tool:
          type: string
        arguments:
          type: object
        data:
          type: object
          description: The analysis result model serialized to JSON.
    ChartSpec:
      type: object
      description: >-
        What to draw for one cited tool result. `line` draws `series_ids`;
        `bar` draws a comparison's entries; `table` lists coverage.
      required: [id, kind, title, result_id, unit, series_ids]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [line, bar, table]
        title:
          type: string
        result_id:
          type: string
        unit:
          type: [string, "null"]
        series_ids:
          type: array
          items:
            type: string

    AnalysisParameters:
      type: object
      description: Parameters for the analysis. Omitted fields take their defaults.
      properties:
        baseline_periods:
          type: integer
          minimum: 2
          default: 10
          description: Number of periods before the investigated one that form the historical baseline.
        anomaly_method:
          type: string
          enum: [z_score]
          default: z_score
        anomaly_threshold:
          type: number
          exclusiveMinimum: 0
          default: 2
          description: Score at or above which a value is flagged as an anomaly.
    InvestigationType:
      type: string
      enum: [trend, comparison, anomaly]
    InvestigationRequest:
      type: object
      description: >-
        What to investigate: a natural-language question, a selection of
        countries, indicators and period, or both.
      required: [question, investigation_type, countries, indicators, period]
      properties:
        question:
          type: [string, "null"]
          maxLength: 2000
          description: The analyst's question, or `null` when the investigation is defined by the selection alone.
        investigation_type:
          $ref: "#/components/schemas/InvestigationType"
        countries:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/CountryCode"
        indicators:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: "#/components/schemas/IndicatorCode"
        period:
          $ref: "#/components/schemas/PeriodRange"
        parameters:
          $ref: "#/components/schemas/AnalysisParameters"
    InvestigationResult:
      type: object
      description: The computed results of an investigation and Gemini's interpretation of them.
      required:
        - data_mode
        - request
        - findings
        - series
        - comparisons
        - baselines
        - anomalies
        - interpretation
        - tool_results
        - charts
        - sources
        - caveats
        - generated_at
      properties:
        data_mode:
          $ref: "#/components/schemas/DataMode"
        request:
          description: >-
            The selection the results cover, or `null` for a run that called
            no tool, such as an unsupported question.
          oneOf:
            - $ref: "#/components/schemas/InvestigationRequest"
            - type: "null"
        findings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
        series:
          type: array
          items:
            $ref: "#/components/schemas/Series"
        comparisons:
          type: array
          items:
            $ref: "#/components/schemas/ComparisonResult"
        baselines:
          type: array
          items:
            $ref: "#/components/schemas/BaselineResult"
        anomalies:
          type: array
          items:
            $ref: "#/components/schemas/AnomalyResult"
        interpretation:
          description: Gemini's interpretation, or `null` when the results have not been interpreted yet.
          oneOf:
            - $ref: "#/components/schemas/Interpretation"
            - type: "null"
        tool_results:
          type: array
          description: The results of a run's successful tool calls, in call order.
          items:
            $ref: "#/components/schemas/ToolResult"
        charts:
          type: array
          description: One chart for each tool result a finding cites.
          items:
            $ref: "#/components/schemas/ChartSpec"
        sources:
          type: array
          description: Every source used by the results.
          items:
            $ref: "#/components/schemas/Source"
        caveats:
          $ref: "#/components/schemas/Caveats"
        generated_at:
          type: string
          format: date-time

    InvestigationStatus:
      type: string
      enum: [pending, running, succeeded, failed]
      description: >-
        Where the investigation is in its run. It moves from `pending` to
        `running`, then to `succeeded` or `failed` (or straight to `failed`);
        any other change is rejected.
    InvestigationCreate:
      type: object
      required: [title, request, result]
      properties:
        status:
          $ref: "#/components/schemas/InvestigationStatus"
        title:
          type: string
          minLength: 1
          maxLength: 200
        request:
          $ref: "#/components/schemas/InvestigationRequest"
        result:
          $ref: "#/components/schemas/InvestigationResult"
    InvestigationUpdate:
      type: object
      description: Fields to change. At least one is required; fields left out keep their values.
      minProperties: 1
      properties:
        status:
          $ref: "#/components/schemas/InvestigationStatus"
        title:
          type: string
          minLength: 1
          maxLength: 200
        request:
          $ref: "#/components/schemas/InvestigationRequest"
        result:
          $ref: "#/components/schemas/InvestigationResult"
    Investigation:
      type: object
      description: >-
        A saved investigation. `data_mode` is the mode it was computed in.
        `request` and `result` are `null` until a run succeeds; a failed
        run has `error` set and never has a result.
      required: [id, title, status, data_mode, request, result, error, run, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          $ref: "#/components/schemas/InvestigationStatus"
        data_mode:
          $ref: "#/components/schemas/DataMode"
        request:
          oneOf:
            - $ref: "#/components/schemas/InvestigationRequest"
            - type: "null"
        result:
          oneOf:
            - $ref: "#/components/schemas/InvestigationResult"
            - type: "null"
        error:
          oneOf:
            - $ref: "#/components/schemas/InvestigationError"
            - type: "null"
        run:
          description: How a run went, or `null` for an investigation saved directly.
          oneOf:
            - $ref: "#/components/schemas/InvestigationRun"
            - type: "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    InvestigationSummary:
      type: object
      description: A saved investigation without its result, for lists.
      required: [id, title, status, data_mode, investigation_type, countries, indicators, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          $ref: "#/components/schemas/InvestigationStatus"
        data_mode:
          $ref: "#/components/schemas/DataMode"
        investigation_type:
          description: The type, or `null` while a run has not decided it.
          oneOf:
            - $ref: "#/components/schemas/InvestigationType"
            - type: "null"
        countries:
          type: array
          items:
            $ref: "#/components/schemas/CountryCode"
        indicators:
          type: array
          items:
            $ref: "#/components/schemas/IndicatorCode"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    InvestigationList:
      type: object
      description: >-
        One page of saved investigations. The top-level `data_mode` is the
        mode the server is running in; each item has the mode it was run in.
      required: [data_mode, items, limit, next_cursor]
      properties:
        data_mode:
          $ref: "#/components/schemas/DataMode"
        items:
          type: array
          items:
            $ref: "#/components/schemas/InvestigationSummary"
        limit:
          type: integer
          description: The page size used.
        next_cursor:
          type: [string, "null"]
          description: Cursor for the next page, or `null` on the last page.

    Selection:
      type: object
      description: Countries, one indicator and a period that limit what a run may query.
      required: [countries, indicator, start, end]
      properties:
        countries:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/CountryCode"
        indicator:
          $ref: "#/components/schemas/IndicatorCode"
        start:
          $ref: "#/components/schemas/PeriodLabel"
        end:
          $ref: "#/components/schemas/PeriodLabel"
    InvestigationRunRequest:
      type: object
      description: >-
        A question, a selection or both; a request with neither is rejected
        with `422`.
      minProperties: 1
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 1000
        selection:
          $ref: "#/components/schemas/Selection"
    InvestigationRunAccepted:
      type: object
      required: [id, status, events_url]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending]
        events_url:
          type: string
          description: The event stream that runs the investigation.
    InvestigationErrorCode:
      type: string
      enum:
        - gemini_not_configured
        - gemini_unavailable
        - gemini_timeout
        - gemini_blocked
        - gemini_truncated
        - gemini_request_error
        - interpretation_invalid
        - data_unavailable
        - timeout
        - step_limit_reached
        - interrupted
        - not_started
        - client_disconnected
        - internal_error
    InvestigationError:
      type: object
      description: Why a run failed.
      required: [code, message, service]
      properties:
        code:
          $ref: "#/components/schemas/InvestigationErrorCode"
        message:
          type: string
        service:
          type: [string, "null"]
          enum: [gemini, data_service, database, null]
    ToolCallRecord:
      type: object
      description: One tool call Gemini asked for, run or refused.
      required: [step, tool, arguments, result_id, status, error, duration_ms]
      properties:
        step:
          type: integer
          minimum: 1
          description: The tool round the call was made in.
        tool:
          type: string
        arguments:
          type: object
        result_id:
          type: string
        status:
          type: string
          enum: [ok, error]
        error:
          type: [string, "null"]
        duration_ms:
          type: number
    LLMUsage:
      type: object
      required: [calls, input_tokens, output_tokens, latency_ms]
      properties:
        calls:
          type: integer
          minimum: 0
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        latency_ms:
          type: number
    ValidationSummary:
      type: object
      description: Counts from checking the interpretation's numbers.
      required: [verified_count, unverified_count, unverified_findings]
      properties:
        verified_count:
          type: integer
          minimum: 0
        unverified_count:
          type: integer
          minimum: 0
        unverified_findings:
          type: integer
          minimum: 0
    InvestigationRun:
      type: object
      description: What a run was asked and what it did.
      required: [question, selection, prompt_version, model, tool_calls, validation, usage]
      properties:
        question:
          type: [string, "null"]
        selection:
          oneOf:
            - $ref: "#/components/schemas/Selection"
            - type: "null"
        prompt_version:
          type: [string, "null"]
        model:
          type: [string, "null"]
        tool_calls:
          type: array
          items:
            $ref: "#/components/schemas/ToolCallRecord"
        validation:
          oneOf:
            - $ref: "#/components/schemas/ValidationSummary"
            - type: "null"
        usage:
          $ref: "#/components/schemas/LLMUsage"

    StartedEvent:
      type: object
      description: "`event: started`, the first event of a run."
      required: [investigation_id]
      properties:
        investigation_id:
          type: string
          format: uuid
    FetchingDataEvent:
      type: object
      description: "`event: fetching_data`, a tool is loading data."
      required: [tool]
      properties:
        tool:
          type: string
    AnalysisStartedEvent:
      type: object
      description: "`event: analysis_started`, a tool is computing its result."
      required: [tool, result_id]
      properties:
        tool:
          type: string
        result_id:
          type: string
    AnalysisFinishedEvent:
      type: object
      description: "`event: analysis_finished`, a tool call ended; `error` is set when it failed."
      required: [tool, result_id, error]
      properties:
        tool:
          type: string
        result_id:
          type: string
        error:
          type: [string, "null"]
    InterpretingEvent:
      type: object
      description: "`event: interpreting`, Gemini is writing the structured interpretation."
      properties: {}
    ValidatingEvent:
      type: object
      description: "`event: validating`, the interpretation's numbers are being checked."
      properties: {}
    SavedEvent:
      type: object
      description: "`event: saved`, the last event of a run that succeeded."
      required: [investigation_id, status]
      properties:
        investigation_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [succeeded]
    FailedEvent:
      type: object
      description: "`event: failed`, the last event of a run that failed."
      required: [investigation_id, code, message, service]
      properties:
        investigation_id:
          type: string
          format: uuid
        code:
          $ref: "#/components/schemas/InvestigationErrorCode"
        message:
          type: string
        service:
          type: [string, "null"]
          enum: [gemini, data_service, database, null]
    InProgressEvent:
      type: object
      description: "`event: in_progress`, another connection is running this investigation."
      required: [investigation_id, status]
      properties:
        investigation_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [running]
