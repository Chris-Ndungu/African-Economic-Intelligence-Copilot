name: Deploy dev

# Runs for a commit on main only after the CI workflow passed for it. It never
# runs for pull requests or forks: it listens to CI runs of `main` pushes only.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/chris-ndungu/african-economic-intelligence-copilot

jobs:
  build:
    name: Build and push the image
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the commit CI tested
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Log in to GHCR with the workflow token
        uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Migrate and deploy to dev
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: dev
      url: ${{ steps.url.outputs.url }}
    # Deploys go one at a time, in order, and one that has started is never
    # cancelled. A deploy still waiting is replaced by a newer one, which
    # contains it, so dev still ends on the latest commit.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out the deploy script
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check that every secret is set
        run: .github/scripts/render-deploy.sh check-secrets

      - name: Find the dev URL
        id: url
        run: echo "url=$(.github/scripts/render-deploy.sh url)" >> "$GITHUB_OUTPUT"

      - name: Record the image dev runs now
        id: previous
        run: echo "image=$(.github/scripts/render-deploy.sh previous)" >> "$GITHUB_OUTPUT"

      # A failure here stops the workflow; the running service is untouched.
      - name: Migrate the dev database
        run: .github/scripts/render-deploy.sh migrate "$IMAGE:$SHA"

      - name: Deploy and wait until live
        id: deploy
        run: echo "id=$(.github/scripts/render-deploy.sh deploy "$IMAGE:$SHA")" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: .github/scripts/render-deploy.sh smoke

      # Runs when the deploy or the smoke test failed (the deploy step ran, so
      # the migration had passed), then the job still ends red.
      - name: Redeploy the previous image
        if: failure() && steps.deploy.conclusion != 'skipped' && steps.previous.outputs.image != ''
        env:
          PREVIOUS: ${{ steps.previous.outputs.image }}
        run: .github/scripts/render-deploy.sh deploy "$PREVIOUS"

      - name: Summary
        if: always()
        env:
          DEPLOY_ID: ${{ steps.deploy.outputs.id }}
          URL: ${{ steps.url.outputs.url }}
          PREVIOUS: ${{ steps.previous.outputs.image }}
        run: |
          {
            echo "### Deploy to dev"
            echo "- Image tag: \`$SHA\`"
            echo "- Render deploy ID: \`$DEPLOY_ID\`"
            echo "- URL: $URL"
            echo "- Previous image: \`$PREVIOUS\`"
          } >> "$GITHUB_STEP_SUMMARY"
